<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fa;
            color: #243247;
        }

        header {
            background: #19385f;
            color: white;
            padding: 25px 5%;
        }

        header h1 {
            margin: 0 0 8px;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 22px;
            padding: 17px 5%;
            background: white;
        }

        nav a {
            color: #19385f;
            font-weight: bold;
            text-decoration: none;
        }

        nav a:hover {
            color: #2878d0;
        }

        .container {
            max-width: 700px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .profile-card {
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.07);
        }

        h2 {
            margin-top: 0;
            color: #19385f;
        }

        .subtitle {
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #2878d0;
        }

        .message {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 6px;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .button {
            display: inline-block;
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            background: #2878d0;
            color: white;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .button:hover {
            background: #185ca7;
        }

        .secondary {
            background: #475569;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

<header>
    <h1>Courier &amp; Parcel Tracking System</h1>
    <p>Customer Profile</p>
</header>

<nav>
    <a th:href="@{/customer-dashboard}">Dashboard</a>
    <a th:href="@{/my-parcels}">My Parcels</a>
    <a th:href="@{/customer-booking}">Book Parcel</a>
    <a th:href="@{/track}">Track Parcel</a>
</nav>

<main class="container">

    <section class="profile-card">

        <h2>My Profile</h2>

        <p class="subtitle">
            View and update your personal contact information.
        </p>

        <div th:if="${successMessage}"
             class="message success"
             th:text="${successMessage}">
        </div>

        <div th:if="${errorMessage}"
             class="message error"
             th:text="${errorMessage}">
        </div>

        <form th:action="@{/customer-profile/update}"
              method="post">

            <div class="form-group">
                <label for="name">Full Name</label>

                <input type="text"
                       id="name"
                       name="name"
                       th:value="${customer.name}"
                       maxlength="100"
                       required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>

                <input type="email"
                       id="email"
                       name="email"
                       th:value="${customer.email}"
                       maxlength="150"
                       required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>

                <input type="tel"
                       id="phone"
                       name="phone"
                       th:value="${customer.phone}"
                       maxlength="20"
                       required>
            </div>

            <div class="form-group">
                <label for="address">Address</label>

                <textarea id="address"
                          name="address"
                          maxlength="500"
                          th:text="${customer.address}"
                          required></textarea>
            </div>

            <div class="actions">

                <button type="submit" class="button">
                    Save Changes
                </button>

                <a th:href="@{/customer-dashboard}"
                   class="button secondary">
                    Back to Dashboard
                </a>

            </div>

        </form>

    </section>

</main>

</body>
</html>
