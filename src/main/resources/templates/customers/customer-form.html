<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            color: #17365d;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button, .back-button {
            display: inline-block;
            margin-top: 20px;
            padding: 11px 18px;
            background: #17365d;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }

        .back-button {
            background: #6c757d;
        }

        .error {
            color: #b02a37;
            font-size: 13px;
            margin-top: 5px;
        }

        .message {
            color: #b02a37;
            margin-top: 12px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Customer Management</h1>

    <h2 th:text="${customer.id == null ? 'Register Customer' : 'Update Customer'}">
        Register Customer
    </h2>

    <div th:if="${errorMessage}"
         class="message"
         th:text="${errorMessage}">
    </div>

    <form th:object="${customer}"
          th:action="${customer.id == null ? '/customers/save' : '/customers/update/' + customer.id}"
          method="post">

        <label for="name">Full Name</label>

        <input type="text"
               id="name"
               th:field="*{name}"
               maxlength="100"
               required>

        <div class="error"
             th:if="${#fields.hasErrors('name')}"
             th:errors="*{name}">
        </div>


        <label for="email">Email Address</label>

        <input type="email"
               id="email"
               th:field="*{email}"
               maxlength="150"
               required>

        <div class="error"
             th:if="${#fields.hasErrors('email')}"
             th:errors="*{email}">
        </div>


        <label for="phone">Phone Number</label>

        <input type="tel"
               id="phone"
               th:field="*{phone}"
               maxlength="20"
               required>

        <div class="error"
             th:if="${#fields.hasErrors('phone')}"
             th:errors="*{phone}">
        </div>


        <label for="address">Address</label>

        <textarea id="address"
                  th:field="*{address}"
                  rows="4"
                  required></textarea>

        <div class="error"
             th:if="${#fields.hasErrors('address')}"
             th:errors="*{address}">
        </div>


        <button type="submit"
                th:text="${customer.id == null ? 'Register Customer' : 'Update Customer'}">
            Register Customer
        </button>

        <a th:href="@{/customers}" class="back-button">
            Back
        </a>

    </form>

</div>

</body>
</html>
